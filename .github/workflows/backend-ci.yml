name: Backend — CI Build

on:
  workflow_run:
    workflows: ['Backend — Tests']
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  build:
    name: Build frontend + backend + Docker image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for backend (modo real)
        working-directory: frontend
        env:
          VITE_API_MODE: real
          VITE_AUTH_MODE: keycloak
          VITE_KEYCLOAK_ENABLED: 'true'
        run: npm run build:backend

      - name: Build backend JAR
        working-directory: backend
        run: ./mvnw clean package -DskipTests -B --no-transfer-progress

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker image (sem push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/keycloak/Dockerfile
          push: false
          tags: aion-logbook-keycloak:ci
