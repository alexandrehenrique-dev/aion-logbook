keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI}
  # URL interna Docker para buscar JWKs. Em dev local, assume o mesmo host do issuer-uri.
  # Em Docker, KEYCLOAK_JWK_SET_URI aponta para o service interno (http://keycloak:8080/...)
  # enquanto KEYCLOAK_ISSUER_URI aponta para a URL pública (https://host/realms/...).
  # Separar os dois resolve o IllegalStateException de issuer mismatch que vira HTTP 500.
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${keycloak.issuer-uri}/protocol/openid-connect/certs}

spring:
  application:
    name: aion-logbook-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:never}
  info:
    env:
      enabled: true

info:
  app:
    name: Aion Logbook Backend
    description: Backend foundation for Aion Logbook
    java: 21

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

app:
  security:
    enabled: ${AION_SECURITY_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  telegram:
    bug-report:
      enabled: ${TELEGRAM_ENABLED:false}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}

aion:
  scheduler:
    due:
      fixed-delay: ${AION_SCHEDULER_DUE_FIXED_DELAY:60000}
    missed:
      fixed-delay: ${AION_SCHEDULER_MISSED_FIXED_DELAY:300000}
