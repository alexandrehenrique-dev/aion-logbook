# ═══════════════════════════════════════════════════════════════════════════════
# Aion Logbook — Ambiente PRODUÇÃO (Genesis Lab / servidor)
# Copie .env.prod.example para .env e preencha os valores reais.
#
# Uso seguro (preserva dados):
#   docker compose pull && docker compose up -d --build
#
# NÃO usar em deploy normal:
#   docker compose down -v  ← apaga volumes e PERDE usuários/dados
# ═══════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: aion-logbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aion_logbook}
      POSTGRES_USER: ${POSTGRES_USER:-aion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aion_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aion_user} -d ${POSTGRES_DB:-aion_logbook}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: aion-logbook-keycloak
    restart: unless-stopped
    # start-dev em produção: aceita HTTP (nginx/proxy faz TLS).
    # --import-realm: importa apenas se o realm ainda não existe no banco Postgres.
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD obrigatório}
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # KC_HOSTNAME define o issuer dos tokens. Deve ser a URL pública do Keycloak.
      # Ex: https://192.168.0.77  ou  https://meudominio.com/keycloak
      KC_HOSTNAME: ${KC_HOSTNAME:?KC_HOSTNAME obrigatório (URL pública do Keycloak)}
      # Necessário quando Keycloak está atrás de nginx/proxy reverso.
      KC_PROXY_HEADERS: xforwarded
      # Banco Postgres dedicado para persistir realm e usuários entre deploys.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-aion_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
    ports:
      - "${KEYCLOAK_PORT:-8181}:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
      - ./docker/keycloak/scripts:/opt/keycloak/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_PKCE_ENABLED: "true"
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/logbook/}
        VITE_API_MODE: real
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/logbook/api/v1}
        VITE_AUTH_MODE: keycloak
        VITE_KEYCLOAK_ENABLED: "true"
        # URL pública do Keycloak vista pelo browser. Pode incluir path se nginx rotear /keycloak/.
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?VITE_KEYCLOAK_URL obrigatório}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-aion-logbook}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-aion-logbook-web}
        VITE_ENABLE_NOTIFICATIONS: "false"
    container_name: aion-logbook-app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-/logbook}

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aion_logbook}
      DB_USERNAME: ${POSTGRES_USER:-aion_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}

      # Issuer URI externo: deve bater com o claim 'iss' dos tokens emitidos pelo Keycloak.
      # KC_HOSTNAME define o issuer como a URL pública; o backend valida contra ela.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI obrigatório}
      # JWK Set URI interno: busca as chaves pelo nome de serviço Docker (evita mismatch de issuer).
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${VITE_KEYCLOAK_REALM:-aion-logbook}/protocol/openid-connect/certs

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      FLYWAY_ENABLED: "true"
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    ports:
      - "${APP_PORT:-8077}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  aion_postgres_data:
