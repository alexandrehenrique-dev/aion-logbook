name: Deploy Genesis Lab

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-aion-logbook-genesis-lab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Aion Logbook
    runs-on: [self-hosted, linux, x64, genesis]

    env:
      DEPLOY_PATH: ${{ vars.AION_DEPLOY_PATH || '/opt/genesis-lab/services/aion-logbook' }}
      DEPLOY_BRANCH: ${{ vars.AION_DEPLOY_BRANCH || 'develop' }}
      APP_HEALTHCHECK_URL: https://192.168.0.77/logbook/

    steps:
      - name: Mostrar contexto do runner
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Workspace: $GITHUB_WORKSPACE"
          whoami
          pwd
          docker --version
          docker compose version

      - name: Validar diretório de deploy
        run: |
          test -d "$DEPLOY_PATH"
          test -x "$DEPLOY_PATH/deploy.sh"
          test -d "$DEPLOY_PATH/repo"

      - name: Executar deploy
        run: |
          cd "$DEPLOY_PATH"
          ./deploy.sh prod "$DEPLOY_BRANCH"

      - name: Validar aplicação via HTTPS
        run: |
          curl -k --fail --silent --show-error --location --max-time 20 https://192.168.0.77/logbook/ >/dev/null
          echo "Aion Logbook publicado com sucesso."