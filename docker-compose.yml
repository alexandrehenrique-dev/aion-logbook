services:
  postgres:
    image: postgres:16-alpine
    container_name: aion-logbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aion_logbook}
      POSTGRES_USER: ${POSTGRES_USER:-aion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aion_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aion_user} -d ${POSTGRES_DB:-aion_logbook}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    # Em desenvolvimento: usa image direta + volume para hot-reload do tema
    # Em produção: trocar para build: { context: ./docker/keycloak } e remover o volume do tema
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: aion-logbook-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://192.168.0.77
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8181}:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      # Tema customizado montado em desenvolvimento (hot-reload)
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
      - ./docker/keycloak/scripts:/opt/keycloak/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_PKCE_ENABLED: "true"
        VITE_BASE_PATH: /logbook/
        VITE_API_MODE: real
        VITE_API_BASE_URL: /logbook/api/v1
        VITE_AUTH_MODE: keycloak
        VITE_KEYCLOAK_ENABLED: "true"
        VITE_KEYCLOAK_URL: https://192.168.0.77/keycloak
        VITE_KEYCLOAK_REALM: aion-logbook
        VITE_KEYCLOAK_CLIENT_ID: aion-logbook-web
        VITE_ENABLE_NOTIFICATIONS: "false"
    container_name: aion-logbook-app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_CONTEXT_PATH: /logbook

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aion_logbook}
      DB_USERNAME: ${POSTGRES_USER:-aion_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aion_password}

      # Issuer URI externo: deve bater com o claim 'iss' dos tokens emitidos pelo Keycloak.
      # KC_HOSTNAME define o issuer como a URL pública; o backend valida contra ela.
      KEYCLOAK_ISSUER_URI: https://192.168.0.77/realms/aion-logbook
      # JWK Set URI interno: busca as chaves públicas pelo nome de serviço Docker.
      # Evita que o backend tente alcançar a URL pública de dentro do container.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/aion-logbook/protocol/openid-connect/certs

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      SWAGGER_ENABLED: "true"
      FLYWAY_ENABLED: "true"
      TELEGRAM_ENABLED: "false"
    ports:
      - "8077:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  aion_postgres_data:
