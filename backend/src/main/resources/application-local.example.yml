aion:
  scheduler:
    due:
      fixed-delay: 60000
    missed:
      fixed-delay: 300000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/aion_logbook
    username: aion_user
    password: aion_password
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/aion-logbook
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    enabled: true
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
