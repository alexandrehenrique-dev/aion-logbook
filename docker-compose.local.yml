# ═══════════════════════════════════════════════════════════════════════════════
# Aion Logbook — Ambiente LOCAL
# Sobe apenas postgres + keycloak. Backend e frontend rodam fora do Docker.
#
# Uso:
#   docker compose -f docker-compose.local.yml up -d
#   # Backend: cd backend && mvn spring-boot:run -Dspring.profiles.active=local
#   # Frontend: cd frontend && npm run dev
#
# Para parar SEM perder dados:
#   docker compose -f docker-compose.local.yml stop
#
# Para resetar volumes locais (DESTRUTIVO — apaga usuários e dados):
#   docker compose -f docker-compose.local.yml down -v
# ═══════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: aion-logbook-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aion_logbook}
      POSTGRES_USER: ${POSTGRES_USER:-aion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aion_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aion_postgres_data_local:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aion_user} -d ${POSTGRES_DB:-aion_logbook}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: aion-logbook-keycloak-local
    restart: unless-stopped
    # start-dev: HTTP simples, sem TLS, ideal para localhost.
    # --import-realm: importa apenas se o realm ainda não existe no banco.
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Sem KC_HOSTNAME → Keycloak resolve para http://localhost:8181 automaticamente.
      # Sem KC_PROXY_HEADERS → sem proxy reverso local.
      # Banco Postgres dedicado para persistir realm e usuários entre restarts.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-aion_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-aion_password}
    ports:
      - "${KEYCLOAK_PORT:-8181}:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aion_postgres_data_local:
