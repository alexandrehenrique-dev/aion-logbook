aion:
  scheduler:
    due:
      fixed-delay: 60000
    missed:
      fixed-delay: 300000

keycloak:
  issuer-uri: http://localhost:8181/realms/aion-logbook
  # jwk-set-uri assume o default ${keycloak.issuer-uri}/protocol/openid-connect/certs

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/aion_logbook
    username: aion_user
    password: aion_password
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    enabled: true
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:8080
  # URL do servidor de desenvolvimento Vite. Usado pelo LocalDevSpaController para redirecionar
  # quem acessa localhost:8080 por engano. O default (localhost:5173) é o padrão do Vite.
  frontend:
    dev-server: http://localhost:5173
  telegram:
    bug-report:
      enabled: ${TELEGRAM_ENABLED:false}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
