services:
  postgres:
    image: postgres:16-alpine
    container_name: aion-logbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aion_logbook}
      POSTGRES_USER: ${POSTGRES_USER:-aion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aion_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aion_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aion_user} -d ${POSTGRES_DB:-aion_logbook}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    # Em desenvolvimento: usa image direta + volume para hot-reload do tema
    # Em produção: trocar para build: { context: ./docker/keycloak } e remover o volume do tema
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: aion-logbook-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${KEYCLOAK_PORT:-8181}:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      # Tema customizado montado em desenvolvimento (hot-reload)
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
      - ./docker/keycloak/scripts:/opt/keycloak/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aion-logbook-app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_CONTEXT_PATH: /logbook

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aion_logbook}
      DB_USERNAME: ${POSTGRES_USER:-aion_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aion_password}

      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/aion-logbook

      CORS_ALLOWED_ORIGINS: http://192.168.0.77,http://192.168.0.77:8077

      SWAGGER_ENABLED: "true"
      FLYWAY_ENABLED: "true"
      TELEGRAM_ENABLED: "false"
    ports:
      - "8077:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  aion_postgres_data:
